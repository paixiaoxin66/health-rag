[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-rag"
version = "0.1.0"
description = "Production-oriented RAG knowledge base for health and nutrition information"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
# 让 pytest 无论用 `pytest` 还是 `python -m pytest` 启动，
# 都把项目根目录加入 sys.path（tests/ 引用了根目录下的 evaluation/ 模块）
pythonpath = ["."]
testpaths = ["tests"]